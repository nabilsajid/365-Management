# Runs new database updates (supabase/migrations) on the live Supabase project
# when they reach main, so they no longer have to be pasted into the SQL Editor.
#
# Off until these repository secrets are added (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – the project id (the part before .supabase.co)
#   SUPABASE_DB_PASSWORD   – the database password
#   SUPABASE_DB_URL        – the "Session pooler" connection string from Supabase → Connect,
#                            with [YOUR-PASSWORD] replaced (GitHub cannot reach the direct address)
# One-time step first: mark the updates already run by hand as done (see docs/ARCHITECTURE.md,
# "Automatic database updates"), otherwise Supabase would try to run them again.
name: Database update

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would run, change nothing'
        type: boolean
        default: true

concurrency:
  group: database-update
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Skip when not set up
        id: ready
        run: |
          if [ -z "$DB_URL" ]; then
            echo "Database secrets are not set; nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.go == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.ready.outputs.go == 'true'
        name: Show what will run
        run: |
          set -o pipefail
          supabase db push --db-url "$DB_URL" --dry-run 2>&1 | tee plan.txt
          # Safety: if the first update is listed, the one-time "already done" step was skipped,
          # and pushing would re-run every update on the live database. Stop instead.
          if grep -q 20261112000001 plan.txt; then
            echo "::error::Supabase thinks no updates have been run yet. Run the one-time 'mark as done' SQL first (docs/ARCHITECTURE.md)."
            exit 1
          fi
      - if: steps.ready.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        name: Run the new updates
        run: supabase db push --db-url "$DB_URL"
